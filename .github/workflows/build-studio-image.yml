name: Build & Push Studio Image

on:
  push:
    branches: [master]
    paths:
      - 'packages/pg-meta/**'
      - 'apps/studio/**'
      - 'apps/ui-library/**'
      - 'apps/design-system/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-studio-image.yml'
  workflow_dispatch: # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Override these via repo variables (Settings → Secrets and variables → Actions → Variables)
  # to retarget the build at a fork's own registry/image without editing the workflow.
  IMAGE_REGISTRY: ${{ vars.STUDIO_IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.STUDIO_IMAGE_NAME || 'zbcoding/superbase2-studio' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        if: success() && env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body -X GET "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Print pushed image timestamp
        if: success()
        run: |
          IMAGE_SHA="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          docker pull "$IMAGE_SHA" >/dev/null
          CREATED=$(docker inspect "$IMAGE_SHA" --format '{{.Created}}')
          DIGEST=$(docker inspect "$IMAGE_SHA" --format '{{index .RepoDigests 0}}')
          echo "================================================================"
          echo "Studio image built at: $CREATED"
          echo "Digest: $DIGEST"
          echo "Tags:"
          echo "  $IMAGE_LATEST"
          echo "  $IMAGE_SHA"
          echo "================================================================"
