name: Build & Push Studio Image

on:
  push:
    branches: [master, development]
    paths:
      - 'packages/pg-meta/**'
      - 'apps/studio/**'
      - 'apps/ui-library/**'
      - 'apps/design-system/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-studio-image.yml'
  workflow_dispatch: # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Override these via repo variables (Settings → Secrets and variables → Actions → Variables)
  # to retarget the build at a fork's own registry/image without editing the workflow.
  IMAGE_REGISTRY: ${{ vars.STUDIO_IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.STUDIO_IMAGE_NAME || 'zbcoding/superbase2-studio' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Job-level, not step-level: a step's own `env` is not visible to its `if`.
      # Each branch redeploys its own Coolify application, so a development
      # push can never redeploy production.
      COOLIFY_WEBHOOK: ${{ github.ref_name == 'master' && secrets.COOLIFY_WEBHOOK || github.ref_name == 'development' && secrets.COOLIFY_WEBHOOK_DEVELOPMENT || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          push: true
          # master owns :latest (what production pulls); every other branch
          # gets a moving tag named after itself, so a development build can
          # never overwrite the image production is running.
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the Coolify app to the image this run just built, then redeploy.
      # A moving tag (:latest / :development) lets a redeploy pull a Studio
      # built from a different commit than the compose file and agent it runs
      # beside. Requires a STUDIO_IMAGE_TAG variable to exist on the Coolify
      # application (the API only updates existing variables).
      - name: Trigger Coolify redeploy
        if: success() && env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # The deploy webhook is <coolify>/api/v1/deploy?uuid=<app-uuid>[&...].
          COOLIFY_API="${COOLIFY_WEBHOOK%%/api/v1/*}/api/v1"
          APP_UUID=$(printf '%s' "$COOLIFY_WEBHOOK" | sed -n 's/.*[?&]uuid=\([^&]*\).*/\1/p')
          if [ -z "$APP_UUID" ]; then
            echo "COOLIFY_WEBHOOK has no uuid= parameter: expected <coolify>/api/v1/deploy?uuid=<app-uuid>" >&2
            exit 1
          fi
          curl --fail-with-body -X PATCH "$COOLIFY_API/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"STUDIO_IMAGE_TAG\",\"value\":\"${{ github.sha }}\"}"
          curl --fail-with-body -X GET "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Print pushed image timestamp
        if: success()
        run: |
          IMAGE_SHA="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ github.ref_name == 'master' && 'latest' || github.ref_name }}"
          docker pull "$IMAGE_SHA" >/dev/null
          CREATED=$(docker inspect "$IMAGE_SHA" --format '{{.Created}}')
          DIGEST=$(docker inspect "$IMAGE_SHA" --format '{{index .RepoDigests 0}}')
          echo "================================================================"
          echo "Studio image built at: $CREATED"
          echo "Digest: $DIGEST"
          echo "Tags:"
          echo "  $IMAGE_LATEST"
          echo "  $IMAGE_SHA"
          echo "================================================================"
